<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login do Lojista — Sacolão Sustentável</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <main class="container py-4" style="max-width:420px;">
    <h1 class="h5 fw-bold mb-3">Acesso do Lojista</h1>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="alert alert-{{ cat }}">{{ msg }}</div>
      {% endfor %}
    {% endwith %}
    <form method="POST">
      <div class="mb-3">
        <label for="email" class="form-label fw-semibold">E-mail</label>
        <input type="email" id="email" name="email" class="form-control" style="min-height:48px;" required>
      </div>
      <div class="mb-3">
        <label for="senha" class="form-label fw-semibold">Senha</label>
        <input type="password" id="senha" name="senha" class="form-control" style="min-height:48px;" required>
      </div>
      <button type="submit" class="btn btn-success w-100 fw-bold" style="min-height:48px;">Entrar</button>
    </form>
  </main>
</body>
</html>
